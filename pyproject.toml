[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code2design"
version = "0.5.1"
description = "Code to evidence-backed data-flow design: DFDs, STRIDE per element, control-path traceability, OTM and SARIF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "tree-sitter>=0.23,<0.27",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-c-sharp>=0.23",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
code2design = "code2design.__main__:main"

[tool.setuptools]
packages = ["code2design", "code2design.detectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
